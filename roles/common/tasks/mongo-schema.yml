
- name: Create MongoDB Repo File
  ansible.builtin.copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo


- name: Install MongoDB
  ansible.builtin.dnf:
    name: mongodb-org-shell
    state: latest

- name: Download DOCUMENTDB Pem file
  ansible.builtin.get_url:
    url: https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
    dest: /app/rds-combined-ca-bundle.pem

- name: Load Mongo Schema
  ansible.builtin.shell: mongo --ssl --host {{ lookup('aws_ssm', 'docdb.{{env}}.endpoint', region='us-east-1' ) }}:27017 --sslCAFile /app/rds-combined-ca-bundle.pem --username docdbadmin --password roboshop1234 </app/schema/{{component}}.js
