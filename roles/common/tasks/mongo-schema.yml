
- name: Create MongoDB Repo File
  ansible.builtin.copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo


- name: Install MongoDB
  ansible.builtin.dnf:
    name: mongodb-org-shell
    state: latest

- name: Load Mongo Schema
  ansible.builtin.shell: mongo --ssl --host {{ lookup('aws_ssm', 'docdb.{{env}}.endpoint', region='us-east-1' ) }}:27017 --sslCAFile global-bundle.pem --username docdbadmin --password roboshop1234 </app/schema/catalogue.js </app/schema/{{component}}.js
