#    dest: /app
#    remote_src: yes


- name: Download File and Extract Content from Nexus
  ansible.builtin.unarchive:
    src: http://"{{ lookup('aws_ssm', 'nexus.username', region='us-east-1' ) }}":"{{ lookup('aws_ssm', 'nexus.password', region='us-east-1' ) }}"@172.31.243:8081/repository/{{component}}/{{component}}-"{{ lookup('aws_ssm', '{{component}}.{{env}}.{{appVersion}}', region='us-east-1' ) }}".zip
    dest: /app
    remote_src: yes


