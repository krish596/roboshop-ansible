
- name: Add Application User
  ansible.builtin.user:
    name: roboshop

- name: Remove Directory
  ansible.builtin.file:
    path: /app
    state: absent

- name: Create Directory
  ansible.builtin.file:
    path: /app
    state: directory

#- name: Download File and Extract Content
#  ansible.builtin.unarchive:
